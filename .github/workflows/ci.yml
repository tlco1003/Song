name: Node checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run firebase:prepare
      - run: |
          test -s functions/src/lyria-music-provider.mjs
          test -s functions/src/lyria-paid-automation.mjs
          test -s functions/src/google-drive-private-music-backup.mjs
          node --check functions/src/lyria-music-provider.mjs
          node --check functions/src/lyria-paid-automation.mjs
          node --check functions/src/google-drive-private-music-backup.mjs
          node --check functions/src/firebase-production.mjs
