name: Cinematic WebGL browser smoke
on:
  pull_request:
    paths:
      - 'docs/cinematic/**'
      - 'docs/index.html'
      - 'scripts/cinematic-browser-smoke.mjs'
      - '.github/workflows/cinematic-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'docs/cinematic/**'
      - 'docs/index.html'
      - 'scripts/cinematic-browser-smoke.mjs'
      - '.github/workflows/cinematic-browser-smoke.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Render real Three.js canvas and verify original homepage
        run: |
          python3 -m http.server 8765 --directory docs > /tmp/song-cinematic-http.log 2>&1 &
          sleep 2
          node scripts/cinematic-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-cinematic-browser-shots
          path: artifacts/*.png
          if-no-files-found: ignore
