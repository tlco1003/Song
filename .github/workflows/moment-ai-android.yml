name: MOMENT AI Pleos Android host build
on:
  workflow_dispatch:
  push:
    paths:
      - 'moment-ai-android/**'
      - 'docs/moment-ai/index.html'
      - '.github/workflows/moment-ai-android.yml'

permissions:
  contents: read

jobs:
  android-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Verify Ubuntu runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" ]]; then
            sdkmanager --install 'platforms;android-35'
          fi
          if [[ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            sdkmanager --install 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Build MOMENT AI host (Pleos Vehicle 2.3.2 / NaviHelper 3.0.5)
        run: ./moment-ai-android/gradlew -p moment-ai-android :app:assembleDebug --stacktrace
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moment-ai-pleos-host-debug
          path: moment-ai-android/app/build/outputs/apk/debug/*.apk
          retention-days: 7