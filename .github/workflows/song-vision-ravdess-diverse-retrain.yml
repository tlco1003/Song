name: SONG Vision RAVDESS diverse singing masked retrain
on:
  push:
    branches:
      - feature/song-vision-self-hosted-v1
    paths:
      - 'song_vision/external_ravdess_diverse_retrain.py'
      - '.github/workflows/song-vision-ravdess-diverse-retrain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: song-vision-diverse-retrain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diverse_masked_research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for source A/V
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install CPU-only local PyTorch training packages
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r song_vision/requirements.txt
      - name: Train on twenty different RAVDESS song takes, publish numerical results only
        run: |
          python -m song_vision.external_ravdess_diverse_retrain --acknowledge-noncommercial-research --epochs 10
      - name: No original or derivative biometrics uploaded
        if: always()
        run: echo "Research-only training artifacts destroyed with temporary runner."
