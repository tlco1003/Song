name: SONG Vision RAVDESS diverse singing masked retrain
on:
  push:
    branches:
      - feature/song-vision-self-hosted-v1
    paths:
      - 'song_vision/external_ravdess_diverse_retrain.py'
      - 'song_vision/research_checkpoint_vault.py'
      - 'song_vision/research_vault_public.pem'
      - '.github/workflows/song-vision-ravdess-diverse-retrain.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: song-vision-diverse-retrain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diverse_masked_research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      RESEARCH_VAULT_FOLDER: ${{ github.workspace }}/song-research-vault-output
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for source A/V
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install CPU-only PyTorch and encryption dependencies
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -q -r song_vision/requirements.txt
          python -m pip install -q 'cryptography>=42,<48'
      - name: Train on twenty singing takes; seal research-only checkpoint before cleanup
        run: |
          python -m song_vision.external_ravdess_diverse_retrain \
            --acknowledge-noncommercial-research \
            --epochs 36 --min-epochs 20 --patience 10 \
            --vault-public-key song_vision/research_vault_public.pem \
            --vault-output-dir "$RESEARCH_VAULT_FOLDER"
      - name: Store encrypted research checkpoint as 90-day emergency artifact
        uses: actions/upload-artifact@v4
        with:
          name: song-ravdess-encrypted-vault-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.RESEARCH_VAULT_FOLDER }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Commit encrypted checkpoint to durable research vault branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            refs/heads/research/song-vision-vault:refs/remotes/origin/research/song-vision-vault
          git worktree add --detach "$RUNNER_TEMP/song-research-vault-worktree" \
            refs/remotes/origin/research/song-vision-vault
          cd "$RUNNER_TEMP/song-research-vault-worktree"
          mkdir -p encrypted/ravdess-actor-01
          cp "$RESEARCH_VAULT_FOLDER"/*.svault encrypted/ravdess-actor-01/
          cp "$RESEARCH_VAULT_FOLDER"/*.manifest.json encrypted/ravdess-actor-01/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add encrypted/ravdess-actor-01/
          if git diff --cached --quiet; then
            echo 'Expected a new immutable encrypted research checkpoint'
            exit 1
          fi
          git commit -m "research-vault: preserve encrypted noncommercial model run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push origin HEAD:refs/heads/research/song-vision-vault
      - name: Report backup locations, never expose the private key
        run: |
          echo 'Research checkpoint encrypted; no raw media uploaded.'
          echo 'Durable encrypted copy: research/song-vision-vault branch.'
          echo 'Temporary second copy: this Actions run artifacts (expires by GitHub policy).'
