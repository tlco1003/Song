name: SONG Vision masked audio-conditioning RAVDESS retrain
on:
  push:
    branches:
      - feature/song-vision-self-hosted-v1
    paths:
      - 'song_vision/masked_retrain.py'
      - 'song_vision/external_ravdess_retrain.py'
      - '.github/workflows/song-vision-ravdess-masked-retrain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: song-vision-masked-retrain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  masked_research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install CPU-only self-hosted training dependencies
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r song_vision/requirements.txt
      - name: Train on temporary RAVDESS singing takes, emit only numerical quality metrics
        run: |
          python -m song_vision.external_ravdess_retrain --acknowledge-noncommercial-research --epochs 6
      - name: Affirm no data or weights published
        if: always()
        run: echo "No video, singing audio, face crops, checkpoints or derivatives published."
