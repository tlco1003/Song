name: SONG Vision licensed noncommercial research data training
on:
  push:
    branches:
      - feature/song-vision-self-hosted-v1
    paths:
      - 'song_vision/external_ravdess_research.py'
      - '.github/workflows/song-vision-ravdess-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: song-vision-external-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ravdess_research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install CPU-only research model dependencies
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r song_vision/requirements.txt
      - name: RAVDESS research-only singer training
        run: |
          python -m song_vision.external_ravdess_research --acknowledge-noncommercial-research --epochs 1
      - name: No raw media or weights uploaded
        if: always()
        run: echo "Ephemeral research data only; no video, face, vocal or checkpoint artifacts published."
