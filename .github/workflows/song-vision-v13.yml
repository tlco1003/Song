name: SONG Vision v13 staged articulation prosody emotion fusion training
on:
  push:
    branches:
      - feature/song-vision-self-hosted-v1
    paths:
      - 'song_vision/phoneme_targets_v13.py'
      - 'song_vision/projected_iris_v13.py'
      - 'song_vision/staged_face_v13.py'
      - 'song_vision/external_ravdess_v13.py'
      - 'song_vision/test_staged_face_v13.py'
      - '.github/workflows/song-vision-v13.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: song-vision-v13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  staged_singer_face_research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      FACE_TASK: ${{ github.workspace }}/face_landmarker.task
      MODEL_BACKUP_DIR: ${{ github.workspace }}/staged-v13-encrypted-research-backup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch, local MediaPipe, FFmpeg, face runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libgles2 libegl1 libgl1 libglib2.0-0
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r song_vision/requirements-geometry.txt
      - name: Actual stage optimizer regression, reviewed phones and no-labeled guard
        run: |
          python -m unittest song_vision.test_staged_face_v13 \
            song_vision.test_intensity_pairs_v12 song_vision.test_research_checkpoint_vault -v
      - name: Verify pinned offline face landmarker before private research data
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-delay 8 --max-time 240 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            --output "$FACE_TASK"
          echo '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  '"$FACE_TASK" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          from song_vision.face_geometry import LocalFaceLandmarker
          with LocalFaceLandmarker(Path("face_landmarker.task")) as detector:
              assert detector.model is not None
          print("SONG_V13_FACE_TEACHER_LOCAL_RUNTIME=PASS")
          PY
      - name: Train four stages on authentic noncommercial singer videos (unseen third performer)
        shell: bash
        run: |
          python -m song_vision.external_ravdess_v13 \
            --acknowledge-noncommercial-research \
            --landmarker-task "$FACE_TASK" \
            --vault-public-key song_vision/research_vault_public.pem \
            --vault-output-dir "$MODEL_BACKUP_DIR" \
            --art-epochs 1 --prosody-epochs 1 --emotion-epochs 1 --fusion-epochs 1
      - name: Archive encrypted-only research checkpoint as 90-day artifact
        uses: actions/upload-artifact@v4
        with:
          name: song-vision-v13-four-stage-encrypted-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.MODEL_BACKUP_DIR }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve research weights (ciphertext only) on owner model vault branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/research/song-vision-vault:refs/remotes/origin/research/song-vision-vault
          git worktree add --detach "$RUNNER_TEMP/song-v13-research-vault" refs/remotes/origin/research/song-vision-vault
          cd "$RUNNER_TEMP/song-v13-research-vault"
          mkdir -p encrypted/ravdess-four-stage-v13
          cp "$MODEL_BACKUP_DIR"/*.svault encrypted/ravdess-four-stage-v13/
          cp "$MODEL_BACKUP_DIR"/*.manifest.json encrypted/ravdess-four-stage-v13/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add encrypted/ravdess-four-stage-v13/
          if git diff --cached --quiet; then
            echo 'No new encrypted research weights; refusing false backup success'
            exit 1
          fi
          git commit -m "research-vault: preserve v13 four-stage singing face study $GITHUB_RUN_ID a$GITHUB_RUN_ATTEMPT"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/research/song-vision-vault; then
              exit 0
            fi
            sleep $((4 * attempt))
            git fetch origin research/song-vision-vault
            git rebase FETCH_HEAD
          done
          echo 'Encrypted research model vault could not be updated'
          exit 1
      - name: Study scope declaration
        run: |
          echo 'Noncommercial RAVDESS research only, no raw personal media committed.'
          echo 'This model makes face-motion pixels/coefficients, never speech/audio.'
          echo 'Phoneme heads without reviewed phone annotations are untrained and flagged.'
          echo 'SONG paid customer jobs remain disabled.'
