name: SONG Vision v15 learned word feelings and facial body motion
on:
  push:
    branches:
      - feature/song-vision-self-hosted-v1
    paths:
      - 'song_vision/word_feelings_v15.py'
      - 'song_vision/lyric_intent_v15.py'
      - 'song_vision/learned_face_body_v15.py'
      - 'song_vision/external_semantic_face_v15.py'
      - 'song_vision/research_vault_v15.py'
      - 'song_vision/test_semantic_body_v15.py'
      - '.github/workflows/song-vision-v15-semantic-body.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: song-v15-semantic-expressive-skin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_word_and_actual_singer_projected_skin:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      FACE_TASK: ${{ github.workspace }}/face_landmarker.task
      VAULT_OUTPUT: ${{ github.workspace }}/v15-encrypted-new-research-models
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local PyTorch, MediaPipe, FFmpeg and encryption runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libgles2 libegl1 libgl1 libglib2.0-0
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r song_vision/requirements-geometry.txt
      - name: Test trained word meanings, context intent, jaw skin rig and archival
        run: |
          python -m unittest song_vision.test_semantic_body_v15 song_vision.test_research_checkpoint_vault -v
      - name: Obtain and integrity-check local Face Landmarker task
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-delay 8 --max-time 240 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            --output "$FACE_TASK"
          echo '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  '"$FACE_TASK" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          from song_vision.face_geometry import LocalFaceLandmarker
          with LocalFaceLandmarker(Path("face_landmarker.task")) as teacher:
              assert teacher.model is not None
          print("SONG_V15_OFFLINE_FACE_TEACHER=PASS")
          PY
      - name: Actual Korean word human norm research + genuine actor-sung face learning
        run: |
          python -m song_vision.external_semantic_face_v15 \
            --acknowledge-noncommercial-research \
            --face-landmarker-task "$FACE_TASK" \
            --owner-public-key song_vision/research_vault_public.pem \
            --encrypted-research-directory "$VAULT_OUTPUT" \
            --word-epochs 8 --skin-epochs 1 --compare-heldout-frames 40
      - name: Preserve ciphertext only as secondary protected artifact
        uses: actions/upload-artifact@v4
        with:
          name: song-v15-words-facial-skin-encrypted-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.VAULT_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Store three distinct immutable encrypted research checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/research/song-vision-vault:refs/remotes/origin/research/song-vision-vault
          git worktree add --detach "$RUNNER_TEMP/song-v15-owner-vault" refs/remotes/origin/research/song-vision-vault
          cd "$RUNNER_TEMP/song-v15-owner-vault"
          mkdir -p encrypted/word-semantics-muscle-skin-v15
          cp "$VAULT_OUTPUT"/*.svault encrypted/word-semantics-muscle-skin-v15/
          cp "$VAULT_OUTPUT"/*.manifest.json encrypted/word-semantics-muscle-skin-v15/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add encrypted/word-semantics-muscle-skin-v15/
          if git diff --cached --quiet; then
            echo 'No new encrypted model exists; backup NOT completed'
            exit 1
          fi
          git commit -m "research-vault: archive learned word affect and real face skin v15 $GITHUB_RUN_ID a$GITHUB_RUN_ATTEMPT"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/research/song-vision-vault; then
              exit 0
            fi
            sleep $((4 * attempt))
            git fetch origin research/song-vision-vault
            git rebase FETCH_HEAD
          done
          echo 'Owner encrypted research branch unavailable'
          exit 1
      - name: Research conclusions only
        run: |
          echo 'RAVDESS acting labels and Korean published word ratings are DIFFERENT training tasks.'
          echo 'Without timed lyrical performances, word meaning to actual face is NOT validated.'
          echo 'Skin deformation is image-projected learned action, not measured bone/muscle EMG.'
          echo 'No commercial customer video generation is enabled.'
