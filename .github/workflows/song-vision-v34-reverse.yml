name: SONG Vision v34 reverse vowel inference (public synthetic)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/song-vision-v34-reverse.yml'
      - 'song_vision/reverse_pronunciation_v34.py'
      - 'song_vision/test_reverse_pronunciation_v34_public.py'
      - 'song_vision/README_V34.md'
      - 'song_vision/V34_PUBLIC_SUMMARY.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'pandas>=2.1,<3' 'soundfile>=0.12,<1'
      - name: Test audio-only and silent-video feature contracts on synthetic data
        run: PYTHONPATH=song_vision python -m unittest discover -s song_vision -p 'test_reverse_pronunciation_v34_public.py' -v
      - name: Validate limitations and no private source leakage
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('song_vision/V34_PUBLIC_SUMMARY.json').read_text())
          assert r['testEvents']==20
          assert r['trainingEvents']==60
          assert r['heldoutAgreementWithWeakPosition']['audio']==0.85
          assert len(r['importantLimitations'])>=6
          assert not Path('song_vision/V34_SPEECH_VOWEL_REVIEW.csv').exists()
          assert not Path('song_vision/pronunciation_25mb.mp4').exists()
          print('Private audio/video and per-event transcripts stay out of public GitHub.')
          PY
      - name: Report research status without claiming real ASR
        run: |
          echo 'INDEPENDENT_KOREAN_ASR=NOT_AVAILABLE'
          echo 'VOWEL_AUDIO_VIDEO_CROSSCHECK=EXPERIMENTAL_WEAK_LABEL'
          echo 'CONSONANT_TRANSCRIPT_ACCURACY=NOT_VERIFIED'
