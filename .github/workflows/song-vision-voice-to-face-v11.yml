name: SONG Vision v11 pronunciation dynamics to face research
on:
  push:
    branches:
      - feature/song-vision-self-hosted-v1
    paths:
      - 'song_vision/vocal_acoustics.py'
      - 'song_vision/voice_to_face_v11.py'
      - 'song_vision/external_ravdess_voice_to_face_v11.py'
      - 'song_vision/test_voice_to_face_v11.py'
      - 'song_vision/real_training.py'
      - '.github/workflows/song-vision-voice-to-face-v11.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: song-vision-v11-voice-to-face-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research_vocal_to_visible_face:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      RESEARCH_VAULT_FOLDER: ${{ github.workspace }}/research-v11-voice-to-face-backup
      FACE_TASK: ${{ github.workspace }}/face_landmarker.task
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local PyTorch, FFmpeg and offline Face Landmarker runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libgles2 libegl1 libgl1 libglib2.0-0
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r song_vision/requirements-geometry.txt
      - name: Run synthetic vocal sound and face training regression tests
        run: |
          python -m unittest song_vision.test_voice_to_face_v11 song_vision.test_real_training song_vision.test_research_checkpoint_vault -v
      - name: Verify offline Face Landmarker can actually start before downloading singers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-delay 8 --max-time 240 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            --output "$FACE_TASK"
          echo '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  '"$FACE_TASK" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          from song_vision.face_geometry import LocalFaceLandmarker
          with LocalFaceLandmarker(Path("face_landmarker.task")) as tracker:
              assert tracker.model is not None
          print("SONG_V11_OFFLINE_FACE_TEACHER=PASS")
          PY
      - name: Train AUDIO-to-FACE from official RAVDESS singing; actor 03 held out
        run: |
          python -m song_vision.external_ravdess_voice_to_face_v11 \
            --acknowledge-noncommercial-research \
            --landmarker-task "$FACE_TASK" \
            --vault-public-key song_vision/research_vault_public.pem \
            --vault-output-dir "$RESEARCH_VAULT_FOLDER" \
            --epochs 8 --min-epochs 4 --patience 4
      - name: Upload secondary encrypted research backup
        uses: actions/upload-artifact@v4
        with:
          name: song-vision-v11-acoustic-face-encrypted-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.RESEARCH_VAULT_FOLDER }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Persist encrypted research checkpoint on the existing vault branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/research/song-vision-vault:refs/remotes/origin/research/song-vision-vault
          git worktree add --detach "$RUNNER_TEMP/song-v11-weights-worktree" refs/remotes/origin/research/song-vision-vault
          cd "$RUNNER_TEMP/song-v11-weights-worktree"
          mkdir -p encrypted/ravdess-voice-to-face-v11
          cp "$RESEARCH_VAULT_FOLDER"/*.svault encrypted/ravdess-voice-to-face-v11/
          cp "$RESEARCH_VAULT_FOLDER"/*.manifest.json encrypted/ravdess-voice-to-face-v11/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add encrypted/ravdess-voice-to-face-v11
          if git diff --cached --quiet; then
            echo 'No encrypted checkpoint to preserve; refusing success'
            exit 1
          fi
          git commit -m "research-vault: preserve v11 vocal-pronunciation dynamics run $GITHUB_RUN_ID a$GITHUB_RUN_ATTEMPT"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/research/song-vision-vault; then
              exit 0
            fi
            sleep $(( 4 * attempt ))
            git fetch origin research/song-vision-vault
            git rebase FETCH_HEAD
          done
          echo 'Encrypted checkpoint backup failed'
          exit 1
      - name: Confirm output is still noncommercial research
        run: |
          echo 'Only encrypted research weights saved; raw singer video and vocals deleted.'
          echo 'No user private key, no voice synthesizer, no commercial customer model.'
