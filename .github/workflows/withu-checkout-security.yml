name: WITHU checkout security
on:
  pull_request:
    paths:
      - 'src/**'
      - 'firebase/**'
      - 'test/**'
      - 'docs/payment*'
      - 'docs/withu-payment-public-config.js'
      - 'docs/prices.json'
      - 'docs/music-genres.json'
      - 'package.json'
      - 'firestore.rules'
      - '.github/workflows/withu-checkout-security.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'firebase/**'
      - 'test/**'
      - 'docs/payment*'
      - 'docs/withu-payment-public-config.js'
      - 'docs/prices.json'
      - 'docs/music-genres.json'
      - 'package.json'
      - 'firestore.rules'
      - '.github/workflows/withu-checkout-security.yml'

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax checks
        run: npm run check
      - name: Checkout and privacy regression tests (no live credentials)
        run: npm test
